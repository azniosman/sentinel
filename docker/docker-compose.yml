# AI-SOC Docker Compose
# Local AI-Powered Security Operations Center
#
# This Docker Compose configuration orchestrates three services:
# 1. Ollama - Local LLM runtime for AI inference
# 2. AISOC Backend - FastAPI application with all security modules
# 3. AISOC Frontend - Nginx static server for the SOC dashboard
#
# Usage:
#   docker-compose up -d           # Start all services
#   docker-compose down            # Stop all services
#   docker-compose ps              # Check service status
#   docker-compose logs -f         # View logs
#   docker-compose down -v         # Stop and remove volumes (WARNING: deletes data)

services:
  # =============================================================================
  # Ollama Service - Local LLM Runtime
  # =============================================================================
  # Provides local LLM inference for:
  # - RAG-powered threat intelligence queries
  # - AI chat assistant
  # - Embedding generation
  #
  # Models required:
  # - llama3 (or configurable LLM_MODEL)
  # - nomic-embed-text (for embeddings)
  #
  ollama:
    image: ollama/ollama:latest
    container_name: aisoc-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - aisoc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =============================================================================
  # AISOC Backend Service - FastAPI Application
  # =============================================================================
  # Core security operations backend with:
  # - Threat intelligence ingestion
  # - RAG pipeline for AI queries
  # - Network analysis and scanning
  # - IOC correlation engine
  # - Attack simulation (educational)
  # - Autonomous AI security agents
  # - Threat graph database
  # - Scheduler for automated tasks
  #
  aisoc-backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: aisoc-backend
    ports:
      - "8000:8000"
    volumes:
      - aisoc_data:/app/data
      - aisoc_vector_store:/app/vector_store
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LLM_MODEL=llama3
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - LOG_LEVEL=INFO
      - SCHEDULER_ENABLED=true
      - CVE_UPDATE_INTERVAL_HOURS=6
      - EMBEDDING_UPDATE_INTERVAL_HOURS=12
      - NETWORK_SCAN_INTERVAL_HOURS=6
      - THREAT_INTEL_UPDATE_INTERVAL_HOURS=6
      # Optional: Set API key for authentication
      # - API_KEY=your-secure-api-key-here
    networks:
      - aisoc-network
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =============================================================================
  # AISOC Frontend Service - Nginx Static Server
  # =============================================================================
  # Serves the SOC dashboard single-page application
  # Proxies API and WebSocket requests to the backend
  #
  aisoc-frontend:
    image: nginx:alpine
    container_name: aisoc-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - aisoc-network
    depends_on:
      - aisoc-backend
    restart: unless-stopped

# =============================================================================
# Volumes - Persistent Storage
# =============================================================================
# - ollama_data: Stores downloaded LLM models
# - aisoc_data: Stores threat intelligence datasets
# - aisoc_vector_store: Stores ChromaDB vector embeddings
#
volumes:
  ollama_data:
    driver: local
  aisoc_data:
    driver: local
  aisoc_vector_store:
    driver: local

# =============================================================================
# Networks - Service Communication
# =============================================================================
# Isolated bridge network for internal service communication
#
networks:
  aisoc-network:
    driver: bridge
